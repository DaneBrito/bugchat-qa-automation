name: CI - BugChat (Cypress & Newman)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || npm i
      - name: Run Cypress
        run: npm run test:ui
      - name: Run Newman (Postman)
        run: npm run test:api:newman
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: bugchat-reports
          path: |
            reports/**
            cypress/videos/**
            cypress/screenshots/**
